<script>
const canvas = document.getElementById('gameCanvas');
let cw = 0, ch = 0, dpr = Math.min(window.devicePixelRatio || 1, 2);
let initialized = false;
let gameState = 'PLAYING';
let phase = 'intro';
let phaseTimer = 0;
const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || (navigator.maxTouchPoints && navigator.maxTouchPoints > 2);
let joysticksReady = false;
let raceControlsReady = false;
const REDLINE_RPM = 8500;
const CRASH_CAM_SEC = 1.0;

window.gameConfigDefs = {};
window.gameConfig = {};
function parseConfig() {
  try {
    window.gameConfigDefs = JSON.parse(document.getElementById('game-config').textContent);
    for (let k in window.gameConfigDefs) window.gameConfig[k] = window.gameConfigDefs[k].value;
  } catch(e) {}
}
window.updateGameConfig = (key, val) => { if (window.gameConfigDefs[key]) window.gameConfig[key] = val; };

function getShiftRpm() {
  const v = Number(window.gameConfig.shiftRpm);
  return isFinite(v) ? Math.max(5000, Math.min(8200, v)) : 6900;
}
function getBaseGearLength() {
  const v = Number(window.gameConfig.gearLength);
  return isFinite(v) ? Math.max(1, Math.min(2.5, v)) : 1.4;
}
/** Gear length grows longer the higher the gear — each upshift stretches the band */
function getGearLengthForGear(g) {
  const base = getBaseGearLength();
  const gear = Math.max(1, g|0);
  // Progressive: G1 ~ base, then +0.22 per gear, soft cap ~4.5
  return Math.min(4.5, base + (gear - 1) * 0.22);
}
function getGearLength() {
  return getGearLengthForGear(race && race.g ? race.g : 1);
}
function isAutoShift() {
  return Number(window.gameConfig.autoShift) !== 0;
}

const SFX_IDS = ['sfx-startup','sfx-shiftup-1','sfx-shiftup-2','sfx-shiftup-3','sfx-shiftdown-1','sfx-shiftdown-2','sfx-shiftdown-3','sfx-idle','sfx-onidle','sfx-onverylow','sfx-onlow','sfx-onmid','sfx-onhigh','sfx-offverylow','sfx-offlow','sfx-offmid','sfx-offhigh','sfx-limiter','sfx-backfire-1','sfx-backfire-2','sfx-backfire-3','sfx-1','sfx-2','sfx-3','sfx-4','sfx-5','sfx-6','sfx-7','sfx-8','sfx-9','sfx-10','sfx-11','sfx-12'];

const AudioSys = {
  ctx: null, unlocked: false, buffers: {}, loops: {}, master: null, airLoops: {},
  bgmGame: document.getElementById('bgm-game'),
  bgmVictory: document.getElementById('bgm-victory'),
  bgmDefeat: document.getElementById('bgm-defeat'),
  bgmBoss: document.getElementById('bgm-boss'),
  bgmRace: document.getElementById('bgm-race'),
  bgmEuro: document.getElementById('bgm-euro'),
  init() {
    if (!this.ctx) {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.85;
      this.master.connect(this.ctx.destination);
    }
  },
  async loadBuffers() {
    this.init();
    await Promise.all(SFX_IDS.map(async id => {
      try {
        const el = document.getElementById(id);
        if (!el || !el.src) return;
        const res = await fetch(el.src);
        const ab = await res.arrayBuffer();
        this.buffers[id] = await this.ctx.decodeAudioData(ab.slice(0));
      } catch(e) {}
    }));
  },
  unlock() {
    if (this.unlocked) return;
    this.init();
    if (this.ctx.state === 'suspended') this.ctx.resume();
    [this.bgmGame,this.bgmVictory,this.bgmDefeat,this.bgmBoss,this.bgmRace,this.bgmEuro].forEach(a=>{ if(a) a.volume=0.42; });
    this.bgmGame.play().catch(()=>{});
    this.loadBuffers();
    this.unlocked = true;
  },
  playBGM(which) {
    [this.bgmGame,this.bgmVictory,this.bgmDefeat,this.bgmBoss,this.bgmRace,this.bgmEuro].forEach(a=>{ try{a.pause();}catch(e){} });
    const map = { game:this.bgmGame, victory:this.bgmVictory, defeat:this.bgmDefeat, boss:this.bgmBoss, race:this.bgmRace, euro:this.bgmEuro };
    const a = map[which] || this.bgmGame;
    try { a.currentTime = 0; a.play().catch(()=>{}); } catch(e) {}
  },
  playBuf(id, vol, rate) {
    if (!this.ctx || !this.unlocked) return;
    if (!this.buffers[id]) { this.blip(220, 0.06); return; }
    try {
      const s = this.ctx.createBufferSource();
      const g = this.ctx.createGain();
      s.buffer = this.buffers[id];
      s.playbackRate.value = rate || 1;
      g.gain.value = vol == null ? 0.7 : vol;
      s.connect(g); g.connect(this.master);
      s.start();
    } catch(e) {}
  },
  startLoop(id, vol, rate) {
    if (!this.ctx || !this.buffers[id]) return null;
    try {
      const s = this.ctx.createBufferSource();
      const g = this.ctx.createGain();
      s.buffer = this.buffers[id]; s.loop = true;
      if (rate) s.playbackRate.value = rate;
      g.gain.value = vol || 0;
      s.connect(g); g.connect(this.master);
      s.start();
      return { s, g };
    } catch(e) { return null; }
  },
  stopEngine() {
    Object.keys(this.loops).forEach(k => { try { this.loops[k].s.stop(); } catch(e) {} });
    this.loops = {};
  },
  stopAir() {
    Object.keys(this.airLoops).forEach(k => { try { this.airLoops[k].s.stop(); } catch(e) {} });
    this.airLoops = {};
  },
  ensureAir() {
    if (this.airLoops['sfx-1']) return;
    ['sfx-1','sfx-2'].forEach(id => {
      const L = this.startLoop(id, 0.55, 1);
      if (L) this.airLoops[id] = L;
    });
  },
  ensureEngine() {
    if (Object.keys(this.loops).length) return;
    const ids = ['sfx-idle','sfx-onidle','sfx-onverylow','sfx-onlow','sfx-onmid','sfx-onhigh','sfx-offverylow','sfx-offlow','sfx-offmid','sfx-offhigh','sfx-limiter'];
    ids.forEach(id => { const L = this.startLoop(id, 0); if (L) this.loops[id] = L; });
  },
  mixEngine(rpm, thr, on, lim) {
    if (!this.ctx || !this.unlocked) return;
    this.ensureEngine();
    const T = this.ctx.currentTime;
    const set = (id, v, rate) => {
      const L = this.loops[id]; if (!L) return;
      L.g.gain.setTargetAtTime(Math.max(0, v), T, 0.05);
      try { L.s.playbackRate.setTargetAtTime(Math.max(0.5, Math.min(1.6, rate||1)), T, 0.05); } catch(e) {}
    };
    if (!on) { Object.keys(this.loops).forEach(id => set(id, 0, 1)); return; }
    const r = Math.max(800, rpm);
    const bands = [['sfx-idle',1816],['sfx-onidle',2500],['sfx-onverylow',4000],['sfx-onlow',6000],['sfx-onmid',6494],['sfx-onhigh',7989]];
    const off = [['sfx-idle',1816],['sfx-offverylow',4000],['sfx-offlow',5500],['sfx-offmid',6000],['sfx-offhigh',7978]];
    const w = bands.map(b => Math.max(0, 1 - Math.abs(Math.log(r / b[1])) / 0.4));
    const n = Math.sqrt(w.reduce((a,x)=>a+x*x,0)) || 1;
    const ld = thr > 0.04 ? 1 : 0.15;
    const vol = 0.45 + 0.45 * (r / 8500);
    bands.forEach((b,i) => set(b[0], (w[i]/n) * ld * vol, r / b[1]));
    const wo = off.map(b => Math.max(0, 1 - Math.abs(Math.log(r / b[1])) / 0.4));
    const no = Math.sqrt(wo.reduce((a,x)=>a+x*x,0)) || 1;
    off.forEach((b,i) => set(b[0], i===0 ? 0 : (wo[i]/no) * (1-ld) * vol * 0.85, r / b[1]));
    set('sfx-limiter', lim ? 0.5 : 0, 1);
  },
  blip(freq, dur, type) {
    if (!this.ctx || !this.unlocked) return;
    try {
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type || 'square'; o.frequency.value = freq;
      g.gain.setValueAtTime(0.12, this.ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + dur);
      o.connect(g); g.connect(this.ctx.destination);
      o.start(); o.stop(this.ctx.currentTime + dur + 0.02);
    } catch(e) {}
  },
  fanfare() {
    if (!this.ctx || !this.unlocked) return;
    [523,659,784,1046].forEach((f,i) => {
      try {
        const o = this.ctx.createOscillator(), g = this.ctx.createGain();
        o.type = 'square'; o.frequency.value = f;
        g.gain.setValueAtTime(0.14, this.ctx.currentTime + i*0.12);
        g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + i*0.12 + 0.35);
        o.connect(g); g.connect(this.ctx.destination);
        o.start(this.ctx.currentTime + i*0.12); o.stop(this.ctx.currentTime + i*0.12 + 0.4);
      } catch(e) {}
    });
  },
  laugh() {
    if (!this.ctx || !this.unlocked) return;
    [0,0.14,0.28,0.48].forEach((t,i) => {
      try {
        const o = this.ctx.createOscillator(), g = this.ctx.createGain();
        o.type = 'sawtooth'; o.frequency.value = 90 + Math.random()*30 - i*4;
        g.gain.setValueAtTime(0.18, this.ctx.currentTime + t);
        g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + t + 0.28);
        o.connect(g); g.connect(this.ctx.destination);
        o.start(this.ctx.currentTime + t); o.stop(this.ctx.currentTime + t + 0.32);
      } catch(e) {}
    });
  }
};

function setupJoystick(zoneId, knobId, cb) {
  const zone = document.getElementById(zoneId);
  const knob = document.getElementById(knobId);
  const base = zone.querySelector('.joystick-base');
  let active = false, sx = 0, sy = 0, maxD = 42, pid = -1;
  const onDocMove = (e) => {
    if (!active || e.pointerId !== pid) return;
    e.preventDefault();
    let dx = e.clientX - sx, dy = e.clientY - sy;
    const dist = Math.hypot(dx, dy);
    if (dist > maxD) { dx = dx / dist * maxD; dy = dy / dist * maxD; }
    knob.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
    cb(dx / maxD, dy / maxD);
  };
  const end = (e) => {
    if (!active) return;
    if (e && e.pointerId != null && pid !== -1 && e.pointerId !== pid) return;
    active = false;
    try { if (pid !== -1) zone.releasePointerCapture(pid); } catch(_) {}
    pid = -1;
    knob.style.transform = 'translate(0px,0px)';
    cb(0, 0);
    document.removeEventListener('pointermove', onDocMove, true);
    document.removeEventListener('pointerup', end, true);
    document.removeEventListener('pointercancel', end, true);
  };
  zone.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    e.stopPropagation();
    if (active) end(e);
    active = true;
    pid = e.pointerId;
    const r = base.getBoundingClientRect();
    sx = r.left + r.width / 2;
    sy = r.top + r.height / 2;
    try { zone.setPointerCapture(e.pointerId); } catch(_) {}
    document.addEventListener('pointermove', onDocMove, true);
    document.addEventListener('pointerup', end, true);
    document.addEventListener('pointercancel', end, true);
    onDocMove(e);
  }, { passive: false });
}

function setupRaceControls() {
  if (raceControlsReady) return;
  raceControlsReady = true;
  const pedal = document.getElementById('pedal-zone');
  const knob = document.getElementById('pedal-knob');
  let dragging = false, ppid = -1;
  function setThrFromY(clientY) {
    const r = pedal.getBoundingClientRect();
    const t = Math.max(0, Math.min(1, 1 - (clientY - r.top) / r.height));
    race.thr = t < 0.03 ? 0 : t;
    knob.style.bottom = (8 + t * (r.height - 72)) + 'px';
  }
  pedal.addEventListener('pointerdown', e => {
    e.preventDefault(); e.stopPropagation();
    dragging = true; ppid = e.pointerId;
    try { pedal.setPointerCapture(e.pointerId); } catch(_) {}
    setThrFromY(e.clientY);
  }, { passive: false });
  pedal.addEventListener('pointermove', e => {
    if (!dragging || e.pointerId !== ppid) return;
    e.preventDefault(); setThrFromY(e.clientY);
  }, { passive: false });
  const endP = (e) => {
    if (e && ppid !== -1 && e.pointerId !== ppid) return;
    dragging = false; ppid = -1;
  };
  pedal.addEventListener('pointerup', endP);
  pedal.addEventListener('pointercancel', endP);
  document.getElementById('btn-start').addEventListener('pointerdown', e => {
    e.preventDefault(); AudioSys.unlock();
    if (!race.on) {
      race.on = 1; race.cr = 1.2; race.rpm = 900; race.g = 1; race.shiftCd = 0;
      AudioSys.playBuf('sfx-startup', 1);
      document.getElementById('race-msg').textContent = 'ENGINE ON — G1 LEN ' + gearLenLabel(1) + ' @' + shiftLabel();
      vibrate('medium');
    }
  }, { passive: false });
  const br = document.getElementById('btn-brake');
  br.addEventListener('pointerdown', e => { e.preventDefault(); race.brk = 1; }, { passive: false });
  br.addEventListener('pointerup', () => { race.brk = 0; });
  br.addEventListener('pointercancel', () => { race.brk = 0; });
  document.getElementById('btn-up').addEventListener('pointerdown', e => {
    e.preventDefault(); e.stopPropagation(); AudioSys.unlock();
    if (!isDrivePhase(phase) || race.air || !race.on) return;
    if (race.shiftCd > 0) return;
    doShiftUp(true);
  }, { passive: false });
  document.getElementById('btn-down').addEventListener('pointerdown', e => {
    e.preventDefault(); e.stopPropagation(); AudioSys.unlock();
    if (!isDrivePhase(phase) || race.air || !race.on) return;
    if (race.shiftCd > 0) return;
    doShiftDown(true);
  }, { passive: false });
}

function resetRaceState(keepOn) {
  const w = race.world || 'chaos';
  race = { on: keepOn?1:0, rpm: keepOn?1200:0, g: keepOn?1:0, thr:0, brk:0, v: keepOn?20:0, dist:0, lim:0, free: keepOn?1200:0, cr: keepOn?0.5:0, air:0, airT:0, spin:0, world: w, shiftCd:0 };
  crashCam = { t:0, target:null, endAt:0 };
  timeScale = 1;
}

function preserveDrivetrain() {
  return {
    on: race.on, rpm: race.rpm, g: Math.max(1, race.g|0), thr: race.thr, brk: race.brk,
    v: race.v, lim: race.lim, free: race.free, cr: race.cr, air: 0, airT: 0, spin: 0,
    shiftCd: 0
  };
}

function applyDrivetrain(saved, opts) {
  opts = opts || {};
  race.on = saved.on ? 1 : 0;
  race.rpm = saved.rpm;
  race.g = Math.max(1, saved.g|0);
  race.thr = saved.thr || 0;
  race.brk = 0;
  race.v = opts.v != null ? opts.v : saved.v;
  race.lim = 0;
  race.free = saved.free || saved.rpm;
  race.cr = 0;
  race.air = opts.air != null ? opts.air : 0;
  race.airT = opts.airT != null ? opts.airT : 0;
  race.spin = opts.spin != null ? opts.spin : 0;
  race.shiftCd = 0;
  if (opts.resetDist) race.dist = 0;
}

  yaw = 0; pitch = 0; moveInput = {x:0,y:0}; lookInput = {x:0,y:0}; jumpPressed = false;
  materials = 0; toolsGot = 0; barsBroken = false; timeScale = 1;

  document.getElementById('distance').textContent = '0';
  document.getElementById('timer').textContent = '0';
  document.getElementById('go-rewards').classList.add('hidden');
  canvas.style.filter = '';
  resetRaceState(0);
  buildChaseWorld();
  setupMobile();
  setState('PLAYING');
  setPhase('intro');
  AudioSys.playBGM('game');
  AudioSys.unlock();
}

function restartGame() { AudioSys.stopEngine(); AudioSys.stopAir(); initGame(); }

function winGame() {
  if (gameState !== 'PLAYING') return;
  AudioSys.stopEngine(); AudioSys.stopAir();
  setState('GAMEOVER');
  document.getElementById('go-title').textContent = 'HOME!';
  document.getElementById('go-title').style.color = '#22ff66';
  document.getElementById('go-title').style.textShadow = '0 0 24px #00ff44';
  document.getElementById('go-sub').textContent = 'Warp Zone complete — you return to real Earth. Multiverse chase survived!';
  document.getElementById('go-rewards').classList.remove('hidden');
  document.getElementById('restart-btn').textContent = 'PLAY AGAIN';
  AudioSys.playBGM('victory');
  AudioSys.fanfare();
  vibrate('medium');
}

function loseGame(msg) {
  if (gameState !== 'PLAYING') return;
  AudioSys.stopEngine(); AudioSys.stopAir();
  setState('GAMEOVER');
  document.getElementById('go-title').textContent = 'CAUGHT!';
  document.getElementById('go-title').style.color = '#ff2244';
  document.getElementById('go-title').style.textShadow = '0 0 24px #ff0000';
  document.getElementById('go-sub').textContent = msg || 'The Chaos Lord claims another soul...';
  document.getElementById('go-rewards').classList.add('hidden');
  document.getElementById('restart-btn').textContent = 'TRY AGAIN';
  AudioSys.playBGM('defeat');
  AudioSys.laugh();
  vibrate('heavy');
}

function handleGlobalInput(e) {
  AudioSys.unlock();
  if (gameState === 'GAMEOVER') return;
  if (phase === 'intro') {
    setPhase('chase');

function updatePlayer(dt) {
  if (isMobile) {
    yaw -= lookInput.x * 2.8 * dt;
    pitch -= lookInput.y * 2.2 * dt;
    pitch = Math.max(-1.4, Math.min(1.4, pitch));
  }
  const forward = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
  const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
  let move = new THREE.Vector3();
  if (keys['KeyW'] || keys['ArrowUp']) move.add(forward);
  if (keys['KeyS'] || keys['ArrowDown']) move.sub(forward);
  if (keys['KeyA'] || keys['ArrowLeft']) move.sub(right);
  if (keys['KeyD'] || keys['ArrowRight']) move.add(right);
  if (isMobile && (moveInput.x || moveInput.y)) {
    move.add(forward.clone().multiplyScalar(-moveInput.y));
    move.add(right.clone().multiplyScalar(moveInput.x));
  }
  const spd = Math.min(12, window.gameConfig.heroSpeed || 8);
  if (move.length() > 0) {
    move.normalize().multiplyScalar(spd * dt);
    camera.position.add(move);
    distanceTraveled += move.length();
  }
  if ((keys['Space'] || jumpPressed) && camera.position.y <= 1.65) {
    playerVelocity.y = 6;
    vibrate('light');
  }
  playerVelocity.y -= 15 * dt;
  camera.position.y += playerVelocity.y * dt;
  if (camera.position.y < 1.6) { camera.position.y = 1.6; playerVelocity.y = 0; }
  if (!isFinite(camera.position.x) || !isFinite(camera.position.y) || !isFinite(camera.position.z)) {
    camera.position.set(0, 1.6, 0);
  }
  camera.rotation.order = 'YXZ';
  camera.rotation.y = yaw; camera.rotation.x = pitch;
}

function chaseEntity(mesh, spd, dt, now, bobY) {
  if (!mesh) return 999;
  const toP = new THREE.Vector3().subVectors(camera.position, mesh.position);
  const dist = toP.length();
  if (dist > 1.2) {
    toP.normalize().multiplyScalar(spd * dt);
    mesh.position.add(toP);
    if (bobY != null) mesh.position.y = bobY + Math.sin(now * 0.003) * 0.3;
  }
  mesh.lookAt(camera.position.x, mesh.position.y, camera.position.z);
  return dist;
}

function applyDamage(dist, dt) {
  if (dist < 3.5) {
    health -= 22 * dt;
    document.getElementById('health').textContent = Math.max(0, Math.floor(health));
    canvas.style.filter = 'brightness(' + (1 + (3.5 - dist) * 0.35) + ') hue-rotate(-25deg)';
    if (Math.random() < dt * 4) vibrate('medium');
  } else {
    canvas.style.filter = '';
  }
}

function triggerCrash(car) {
  if (!car || !car.userData.alive) return;
  car.userData.alive = false;
  crashCam.t = CRASH_CAM_SEC;
  crashCam.endAt = performance.now() + CRASH_CAM_SEC * 1000;
  crashCam.target = car;
  timeScale = 0.25;
  const id = 'sfx-' + (7 + Math.floor(Math.random() * 6));
  AudioSys.playBuf(id, 0.95);
  vibrate('heavy');
  car.children.forEach((ch, i) => {
    ch.userData.vx = (Math.random()-0.5)*8;
    ch.userData.vy = 3 + Math.random()*5;
    ch.userData.vz = (Math.random()-0.5)*8;
  });
}

function stepCrash(dt, rawDt) {
  if (crashCam.endAt <= 0 && crashCam.t <= 0) { timeScale = 1; return false; }
  const now = performance.now();
  const wallLeft = crashCam.endAt > 0 ? (crashCam.endAt - now) / 1000 : crashCam.t;
  crashCam.t = wallLeft;
  if (wallLeft <= 0) {
    crashCam.t = 0;
    crashCam.endAt = 0;
    crashCam.target = null;
    timeScale = 1;
    camera.position.set(0, 2.2, 6);
    camera.rotation.set(-0.12, 0, 0);
    return false;
  }
  const car = crashCam.target;
  const simDt = rawDt != null ? rawDt : dt;
  if (car) {
    car.children.forEach(ch => {
      if (ch.userData.vy == null) return;
      ch.position.x += (ch.userData.vx||0) * simDt;
      ch.position.y += (ch.userData.vy||0) * simDt;
      ch.position.z += (ch.userData.vz||0) * simDt;
      ch.userData.vy -= 12 * simDt;
      ch.rotation.x += simDt * 4; ch.rotation.z += simDt * 3;
    });
    camera.position.lerp(new THREE.Vector3(car.position.x + 4, car.position.y + 3, car.position.z + 5), Math.min(1, simDt * 6));
    camera.lookAt(car.position);
  }
  return true;
}

function doShiftUp(manual) {
  if (race.g < 1) race.g = 1;
  race.g += 1;
  const gl = getGearLengthForGear(race.g);
  // Longer high gears drop RPM deeper after upshift
  const dropBase = 1800 + (gl - 1) * 520;
  race.rpm = Math.max(900, dropBase + Math.random() * 350);
  race.shiftCd = manual ? 0.28 : 0.22;
  race.lim = 0;
  AudioSys.playBuf('sfx-shiftup-' + (1 + Math.floor(Math.random()*3)), 0.85);
  vibrate('light');
  const msg = document.getElementById('race-msg');
  if (msg && isDrivePhase(phase) && phase !== 'void') {
    msg.textContent = (manual ? 'MANUAL ' : 'AUTO ') + '→ G' + race.g + ' LEN ' + gl.toFixed(2) + ' @' + shiftLabel() + ' ∞';
  }
}

function doShiftDown(manual) {
  if (race.g <= 1) {
    race.g = 1;
    return;
  }
  race.g -= 1;
  const gl = getGearLengthForGear(race.g);
  const sr = getShiftRpm();
  race.rpm = Math.min(REDLINE_RPM - 200, race.rpm * (1.12 + gl * 0.1) + 350);
  if (race.rpm > sr + 200) race.rpm = sr + 100 + Math.random() * 200;
  race.shiftCd = 0.2;
  race.lim = 0;
  AudioSys.playBuf('sfx-shiftdown-' + (1 + Math.floor(Math.random()*3)), 0.85);
  vibrate('light');
  const msg = document.getElementById('race-msg');
  if (msg && isDrivePhase(phase) && phase !== 'void') {
    msg.textContent = (manual ? 'MANUAL ' : '') + '↓ G' + race.g + ' LEN ' + gl.toFixed(2) + ' @' + shiftLabel();
  }
}

function autoShift(dt) {
  if (!race.on || race.air) return;
  if (!isAutoShift()) return;
  if (race.g < 1) race.g = 1;
  if (race.shiftCd > 0) {
    race.shiftCd -= dt;
    return;
  }
  const sr = getShiftRpm();
  if (race.rpm >= sr) {
    doShiftUp(false);
  }
}

function gearAccelFactor() {
  const gl = getGearLengthForGear(race.g);
  // Higher gears + longer length = slower pull, more top-end stretch
  return 1 / Math.pow(Math.max(1, race.g), 0.32 + gl * 0.1);
}

function stepRace(dt, mode, rawDt) {
  if (stepCrash(dt, rawDt)) {
    renderer.render(scene, camera);
    return;
  }
  const idle = 1816;
  const sr = getShiftRpm();
  const gl = getGearLengthForGear(race.g);
  race.lim = 0;
  if (race.air) {
    race.g = 1;
    race.thr = 0;
    if (race.airT < 0.5) {
      race.rpm = 8500;
    } else {
      race.rpm = Math.max(idle, race.rpm - 4200 * dt);
    }
    race.airT += dt;
    AudioSys.ensureAir();
    AudioSys.mixEngine(race.rpm, 0, !!race.on, 0);
  } else if (!race.on) {
    race.rpm = Math.max(0, race.rpm - 2500*dt);
    race.v = Math.max(0, race.v - 3*dt);
    AudioSys.mixEngine(race.rpm, 0, false, 0);
  } else {
    race.cr = Math.max(0, race.cr - dt);
    const t = race.thr;
    if (race.g < 1) race.g = 1;
    const gearFactor = gearAccelFactor();
    let tgt;
    if (race.cr > 0) {
      tgt = 1100;
    } else if (t < 0.04) {
      tgt = idle;
    } else {
      // Longer gears climb RPM slower toward redline
      const climbPow = 0.82 + gl * 0.1;
      tgt = idle + (REDLINE_RPM - idle) * Math.pow(Math.max(0.05, t), climbPow);
    }
    const climb = (race.shiftCd > 0 ? 5.2 : 3.2) / Math.max(1, gl);
    race.rpm += (tgt - race.rpm) * Math.min(1, dt * climb);
    if (race.rpm > sr + 150 && t > 0.35 && race.shiftCd <= 0) race.lim = 1;
    if (race.rpm > REDLINE_RPM) race.rpm = REDLINE_RPM;
    if (race.shiftCd > 0) race.shiftCd -= dt;
    autoShift(dt);
    if (isAutoShift() && race.shiftCd <= 0 && race.rpm >= sr && t > 0.2) {
      doShiftUp(false);
    }
    let a = t * (16 * gearFactor) * (0.8 + gl * 0.1) - (race.brk ? 55 : 0) - 0.000018 * race.v * race.v;
    if (t < 0.05) a -= 4;
    race.v = Math.max(0, race.v + a * dt);
    if (race.on && race.thr < 0.1 && race.rpm > 4500 && Math.random() < dt*0.3) {
      AudioSys.playBuf('sfx-backfire-' + (1+Math.floor(Math.random()*3)), 0.5);
    }
    AudioSys.mixEngine(race.rpm, race.thr, true, !!race.lim);
  }
  race.dist += race.v * dt * 2.2;
  document.getElementById('race-spd').textContent = String(Math.round(race.v));
  document.getElementById('race-rpm').textContent = String(Math.round(race.rpm));
  document.getElementById('race-gear').textContent = race.g ? String(race.g) : 'N';
  document.getElementById('rpm-bar').style.width = Math.min(100, (race.rpm/8500)*100) + '%';
  document.getElementById('distance').textContent = String(Math.floor(race.dist));

  roadLines.forEach(ln => {
    ln.position.z += race.v * dt * 1.8;
    if (ln.position.z > 10) ln.position.z -= 50 * 6 / 10;
  });

  pursuers.forEach((p, i) => {
    if (!p) return;
    const isTwo = p.userData && p.userData.isTwo;
    const slow = p.userData && p.userData.police ? 0.35 : (p === baldiMesh ? 0.4 : isTwo ? 0.55 : 0.45);
    const targetZ = isTwo ? 10 + Math.sin(performance.now()*0.0015)*2 : 14 + i * 3;
    p.position.z += (targetZ - p.position.z) * Math.min(1, dt * (isTwo ? 0.9 : 0.6));
    p.position.x += ((isTwo ? Math.sin(performance.now()*0.002 + i) * 3 : Math.sin(performance.now()*0.001 + i) * 2) - p.position.x) * dt * (isTwo ? 1.8 : 1.2);
    if (isTwo) {
      p.position.y = 0.15 + Math.abs(Math.sin(performance.now()*0.004))*0.2;
      p.lookAt(0, p.position.y, 0);
    }
    if (mode === 'fly' || (mode === 'dbs' && p === gokuMesh)) {
      p.position.y = 4 + Math.sin(performance.now()*0.003+i)*0.5;
    }
    if (vanMesh && p === vanMesh && (mode === 'fly' || mode === 'dbs')) {
      vanMesh.position.y = 3.5 + Math.sin(performance.now()*0.002)*0.4;
    }
  });

  if (mode === 'bfdi' && twoMesh && !race.air) {
    const tz = Math.abs(twoMesh.position.z - 6);
    const tx = Math.abs(twoMesh.position.x);
    if (tz < 4.5 && tx < 3.2 && race.v < 22) {
      health -= 14 * dt;
      document.getElementById('health').textContent = Math.max(0, Math.floor(health));
      canvas.style.filter = 'brightness(1.25) hue-rotate(-40deg)';
      if (Math.random() < dt * 3) vibrate('medium');
    }
  }

  traffic.forEach(car => {
    if (!car.userData.alive) return;
    car.position.z += (race.v * 0.9 + 4) * dt;
    car.position.x += (car.userData.vx||0) * dt;
    if (car.position.z > 12) {
      car.position.z -= 120;
      car.position.x = (Math.random()-0.5)*8;
      car.userData.alive = true;
    }
    if (!race.air && Math.abs(car.position.z - 2) < 2.2 && Math.abs(car.position.x) < 2.2 && race.v > 18) {
      triggerCrash(car);
    }
  });

  if (!race.air && crashCam.t <= 0) {
    camera.position.x = Math.sin(performance.now()*0.004)*0.15*race.thr;
    camera.position.y = 2.2 + Math.sin(performance.now()*0.02)*0.04*(race.v*0.02);
    camera.position.z = 6;
    camera.rotation.order = 'YXZ';
    camera.rotation.y = 0; camera.rotation.x = -0.12; camera.rotation.z = 0;
  }
}

const ro = new ResizeObserver(entries => {
  for (const entry of entries) {
    const cr = entry.contentRect;
    cw = cr.width; ch = cr.height;
    if (cw < 1 || ch < 1) continue;
    canvas.width = cw * dpr; canvas.height = ch * dpr;
    canvas.style.width = cw + 'px'; canvas.style.height = ch + 'px';
    if (renderer && camera) {
      camera.aspect = cw / Math.max(ch, 1);
      camera.updateProjectionMatrix();
      renderer.setSize(cw, ch);
      renderer.setPixelRatio(dpr);
    }
    if (!initialized) {
      initGame();
      initialized = true;
      requestAnimationFrame(loop);
    }
  }
});

let lastTime = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  try {
    let rawDt = Math.min((now - lastTime) / 1000, 0.05);
    lastTime = now;
    let dt = rawDt * timeScale;
    if (gameState !== 'PLAYING' || !camera) return;
    phaseTimer += dt;
    const elapsed = (now - startTime) / 1000;
    document.getElementById('timer').textContent = Math.floor(elapsed);

    if (phase === 'intro') {
      updatePlayer(dt);
      if (skullMesh) chaseEntity(skullMesh, 1.2, dt, now, 2);
      if (phaseTimer > 4.5) { setPhase('chase'); startTime = performance.now(); distanceTraveled = 0; }
      renderer.render(scene, camera);
      return;
    }

    if (phase === 'chase') {
      updatePlayer(dt);
      const chase = (window.gameConfig.skullSpeed || 4.5) + Math.min(3, distanceTraveled / 50);
      const dist = chaseEntity(skullMesh, chase, dt, now, 2);
      applyDamage(dist, dt);
      document.getElementById('distance').textContent = Math.floor(distanceTraveled);
      if (health <= 0) { loseGame('The first skull dragged you into the dark...'); return; }
      if (elapsed >= (window.gameConfig.winTime || 22) || distanceTraveled >= (window.gameConfig.winDist || 55)) {
        health = Math.max(health, 60);
        document.getElementById('health').textContent = Math.floor(health);
        buildPalaceWorld();
        camera.position.set(0, 1.6, 8);
        yaw = 0; pitch = 0; distanceTraveled = 0;
        setPhase('palace');
        vibrate('medium');
        AudioSys.blip(660, 0.15);
      }
      renderer.render(scene, camera);
      return;
    }

    if (phase === 'palace') {
      updatePlayer(dt);
      if (clownMesh) {
        clownMesh.lookAt(camera.position.x, clownMesh.position.y, camera.position.z);
        clownMesh.position.y = 5 + Math.sin(now * 0.002) * 0.4;
      }
      skulls.forEach(s => chaseEntity(s, 2.2, dt, now, 2));
      if (phaseTimer > 5.0) {
        buildJailWorld();
        camera.position.set(0, 1.6, 2);
        yaw = 0; pitch = 0; distanceTraveled = 0;
        health = Math.max(40, health - 10);
        document.getElementById('health').textContent = Math.floor(health);
        setPhase('jail');
        vibrate('heavy');
      }
      renderer.render(scene, camera);
      return;
    }

    if (phase === 'jail') {
      updatePlayer(dt);
      jailers.forEach((j,i) => { j.position.y = Math.sin(now*0.002+i)*0.05; });
      if (jailSkull) {
        const patrol = 4 + Math.sin(now * 0.0012) * 8;
        jailSkull.position.x += (patrol - jailSkull.position.x) * Math.min(1, dt * 2);
        const dist = chaseEntity(jailSkull, (window.gameConfig.skullSpeed || 4.5) * 0.75, dt, now, 2);
        applyDamage(dist, dt);
      }
      tools.forEach(t => {
        if (!t.visible) return;
        if (camera.position.distanceTo(t.position) < 2.2) {
          t.visible = false;
          toolsGot++;
          AudioSys.blip(720, 0.1);
          vibrate('light');
          setStory('TOOL FOUND', toolsGot >= 2 ? 'Break the prison bars!' : 'Find another tool...');
        }
      });
      if (!barsBroken && toolsGot >= 2 && barsGroup && camera.position.distanceTo(new THREE.Vector3(0,1.6,-6)) < 5) {
        barsBroken = true;
        barsGroup.children.forEach((b,i) => {
          b.position.x += (i-5)*0.35;
          b.rotation.z = (i%2?1:-1)*0.6;
        });
        if (exitGate) { exitGate.visible = true; exitGate.material.opacity = 0.6; }
        const glow = scene.getObjectByName('exitGlow');
        if (glow) glow.intensity = 1.6;
        setStory('BARS BROKEN', 'Exit gate unlocked — run!');
        AudioSys.blip(880, 0.15); vibrate('medium');
      }
      document.getElementById('distance').textContent = Math.floor(distanceTraveled);
      if (barsBroken && exitGate && camera.position.distanceTo(exitGate.position) < 4.5) {
        buildFleeWorld();
        camera.position.set(0, 1.6, 0);
        yaw = 0; pitch = 0; distanceTraveled = 0;
        setPhase('flee');
        AudioSys.blip(980, 0.12); vibrate('medium');
      }
      if (health <= 0) { loseGame('The jail skull locked your fate...'); return; }
      renderer.render(scene, camera);
      return;
    }

    if (phase === 'flee') {
      updatePlayer(dt);
      let closest = 999;
      skulls.forEach((s, i) => { closest = Math.min(closest, chaseEntity(s, 4 + i*0.3, dt, now, 2)); });
      pursuers.forEach((p, i) => {
        const spd = p === baldiMesh ? 3.4 : (p === clownMesh ? 3.0 : 2.6);
        closest = Math.min(closest, chaseEntity(p, spd, dt, now, p===clownMesh?5:0));
      });
      applyDamage(closest, dt);
      document.getElementById('distance').textContent = Math.floor(distanceTraveled);
      if (carMesh && camera.position.distanceTo(carMesh.position) < 5) {
        buildDriveWorld('chaos');
        resetRaceState(0);
        setPhase('race');
        AudioSys.playBuf('sfx-startup', 1);
        vibrate('medium');
      }
      if (health <= 0) { loseGame('Chariots and Baldi closed in...'); return; }
      if (phaseTimer > 50) { loseGame('You never reached the getaway car...'); return; }
      renderer.render(scene, camera);
      return;
    }

    if (phase === 'race') {
      stepRace(dt, 'chaos', rawDt);
      if (race.dist >= (window.gameConfig.raceDist || 420)) {
        const saved = preserveDrivetrain();
        buildDriveWorld('bfdi');
        applyDrivetrain(saved, { resetDist: true });
        if (!race.on) { race.on = 1; }
        if (race.g < 1) race.g = 1;
        if (race.rpm < 800) race.rpm = Math.max(race.rpm, 2000);
        setPhase('bfdi');
        setStory('BFDI WORLD', 'Two is after you! FreeSmart SuperVan inbound — keep RPM alive!');
        document.getElementById('race-msg').textContent = 'TWO + VAN • G' + race.g + ' LEN ' + gearLenLabel(race.g) + ' ∞';
        vibrate('medium');
      }
      if (race.v < 6 && race.on && phaseTimer > 8) {
        health -= 20 * dt;
        document.getElementById('health').textContent = Math.max(0, Math.floor(health));
        if (health <= 0) { loseGame('Chaos chariots dragged you out...'); return; }
      }
      renderer.render(scene, camera);
      return;
    }

    if (phase === 'bfdi') {
      stepRace(dt, 'bfdi', rawDt);
      const eta = window.gameConfig.bfdiEta || 120;
      const left = Math.max(0, eta - phaseTimer);
      document.getElementById('race-msg').textContent = 'TWO HUNTS • ETA ' + Math.ceil(left) + 's • G' + race.g + ' L' + gearLenLabel(race.g);
      if (health <= 0) { loseGame('Two caught you in BFDI / TPOT world!'); return; }
      if (left <= 0 || race.dist > 1800) {
        const keepRpm = race.rpm;
        buildDriveWorld('void');
        race.air = 1; race.airT = 0; race.spin = 1; race.g = 1; race.thr = 0;
        race.rpm = Math.max(keepRpm, 5000);
        race.on = 1;
        AudioSys.ensureAir();
        setPhase('void');
        vibrate('heavy');
      }
      renderer.render(scene, camera);
      return;
    }

    if (phase === 'void') {
      stepRace(dt, 'void', rawDt);
      camera.position.y = 8 + Math.sin(phaseTimer*2)*1.5;
      camera.position.z = 6;
      camera.rotation.z = phaseTimer * 3.5;
      camera.rotation.x = -0.2 + Math.sin(phaseTimer)*0.3;
      if (phaseTimer > 0.05 && phaseTimer < 0.1) {
        AudioSys.ensureAir();
      }
      if (phaseTimer > 2.8) {
        AudioSys.playBuf('sfx-3', 0.9, Math.pow(2, 1/12));
        buildDriveWorld('dbs');
        race.air = 1; race.airT = 0.6; race.spin = 0; race.g = 1;
        camera.position.set(0, 15.24, 6);
        setPhase('dbs_air');
        setStory('DRAGON BALL SUPER', 'Warped mid-air over West City!');
        vibrate('medium');
      }
      renderer.render(scene, camera);
      return;
    }

    if (phase === 'dbs_air') {
      stepRace(dt, 'dbs', rawDt);
      const fallY = 15.24 - phaseTimer * 10;
      camera.position.y = Math.max(2.2, fallY);
      camera.rotation.z *= 0.9;
      if (camera.position.y <= 2.25) {
        race.air = 0;
        AudioSys.stopAir();
        const land = 'sfx-' + (4 + Math.floor(Math.random()*3));
        AudioSys.playBuf(land, 1);
        vibrate('heavy');
        race.g = 1; race.rpm = 2000; race.on = 1; race.v = 25; race.shiftCd = 0;
        setPhase('dbs');
        setStory('WEST CITY', 'ETA 2 min to the plane! Z Fighters watch. FreeSmart + Goku chase!');
      }
      renderer.render(scene, camera);
      return;
    }

    if (phase === 'dbs') {
      stepRace(dt, 'dbs', rawDt);
      const dbsEta = window.gameConfig.dbsEta || 120;
      const dLeft = Math.max(0, dbsEta - phaseTimer);
      document.getElementById('race-msg').textContent = 'DBS ETA ' + Math.ceil(dLeft) + 's • G' + race.g + ' L' + gearLenLabel(race.g);
      if (planeMesh) {
        planeMesh.position.z = 6 - Math.max(20, 260 - race.dist);
      }
      const reachPlane = race.dist > 240 || (dLeft <= 0 && race.dist > 120);
      if (dLeft <= 0 && race.dist <= 120) {
        loseGame('DBS ETA expired — Goku and FreeSmart boxed you in!');
        return;
      }
      if (reachPlane) {
        const saved = preserveDrivetrain();
        buildDriveWorld('dbs');
        applyDrivetrain(saved, { air: 1, airT: 1, resetDist: false });
        race.v = Math.max(race.v, 50);
        race.g = 1;
        if (vanMesh) vanMesh.position.y = 4;
        if (gokuMesh) gokuMesh.position.y = 5;
        setPhase('fly');
        AudioSys.ensureAir();
        setStory('FLYING TO YAHHOY', 'FreeSmart SuperVan → flying mode! Goku flies after you!');
      }
      renderer.render(scene, camera);
      return;
    }

    if (phase === 'fly') {
      stepRace(dt, 'fly', rawDt);
      camera.position.y = 6 + Math.sin(now*0.002)*0.4;
      if (vanMesh) { vanMesh.position.set(2, 5, 18); vanMesh.rotation.z = Math.sin(now*0.002)*0.1; }
      if (gokuMesh) { gokuMesh.position.set(-2, 6, 16); }
      document.getElementById('race-msg').textContent = 'YAHHOY APPROACH • WARP POD READY';
      if (race.dist > 280 || phaseTimer > 35) {
        // EXIT THE VEHICLE — Demon Realm on foot
        AudioSys.stopAir();
        AudioSys.stopEngine();
        AudioSys.playBuf('sfx-3', 0.85, Math.pow(2, 1/12));
        const land = 'sfx-' + (4 + Math.floor(Math.random() * 3));
        AudioSys.playBuf(land, 0.9);
        race.on = 0; race.thr = 0; race.v = 0; race.air = 0; race.g = 0; race.rpm = 0;
        materials = 0;
        distanceTraveled = 0;
        buildDemonOnFootWorld();
        setPhase('demon');
        setStory('DEMON REALM — EXITED', 'Goku & FreeSmart give up. You left the V8. Gather materials on foot.');
        vibrate('medium');
      }
      renderer.render(scene, camera);
      return;
    }

    if (phase === 'demon') {
      // On-foot exploration — vehicle exited
      updatePlayer(dt);
      tools.forEach(t => {
        if (!t.visible || !t.userData.mat) return;
        t.rotation.y += dt * 2.2;
        const bob = t.userData.bob || 0;
        t.position.y = 0.55 + Math.sin(now * 0.004 + bob) * 0.2;
        if (camera.position.distanceTo(t.position) < 2.4) {
          t.visible = false;
          materials++;
          AudioSys.blip(640 + materials * 40, 0.08);
          vibrate('light');
          setStory('MATERIALS ' + materials + '/5', materials >= 5 ? 'Warp Zone online — walk into the portal!' : 'Keep gathering pink crystals...');
        }
      });
      if (materials >= 5 && warpZone) {
        warpZone.visible = true;
        warpZone.material.opacity = 0.7 + Math.sin(now * 0.005) * 0.15;
        warpZone.rotation.z += dt * 1.8;
        const glow = scene.getObjectByName('warpGlow');
        if (glow) glow.intensity = 1.8 + Math.sin(now * 0.006) * 0.4;
        if (camera.position.distanceTo(warpZone.position) < 5.5) {
          winGame();
          return;
        }
      }
      if (parkedCar) {
        // subtle idle glow on abandoned car
        parkedCar.rotation.y += Math.sin(now * 0.001) * 0.0002;
      }
      document.getElementById('distance').textContent = Math.floor(distanceTraveled);
      document.getElementById('health').textContent = Math.max(0, Math.floor(health));
      renderer.render(scene, camera);
      return;
    }
  } catch (err) { console.error(err); }
}

document.addEventListener('DOMContentLoaded', () => {
  parseConfig();
  ro.observe(document.getElementById('game-container'));
  setupRaceControls();
  document.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (e.code === 'Space') e.preventDefault();
    AudioSys.unlock();
    if (phase === 'intro' && gameState === 'PLAYING') { setPhase('chase'); startTime = performance.now(); }
    if (isDrivePhase(phase) && race.on && !race.air && gameState === 'PLAYING') {
      if (e.code === 'KeyE' || e.code === 'ShiftRight') doShiftUp(true);
      if (e.code === 'KeyQ' || e.code === 'ControlRight') doShiftDown(true);
    }
  });
  document.addEventListener('keyup', e => { keys[e.code] = false; });
  document.addEventListener('mousemove', e => {
    if (!isMobile && gameState === 'PLAYING' && !isDrivePhase(phase) && document.pointerLockElement === canvas) {
      yaw -= e.movementX * 0.002; pitch -= e.movementY * 0.002;
      pitch = Math.max(-1.4, Math.min(1.4, pitch));
    }
  });
  canvas.addEventListener('click', () => {
    AudioSys.unlock();
    if (phase === 'intro') { setPhase('chase'); startTime = performance.now(); }
    if (!isMobile && gameState === 'PLAYING' && !isDrivePhase(phase)) canvas.requestPointerLock?.();
  });
  window.addEventListener('pointerdown', (e) => {
    const t = e.target;
    if (t && (t.closest && (t.closest('.joystick-zone') || t.closest('#pedal-zone') || t.closest('#jump-btn') || t.closest('.race-btn') || t.closest('#restart-btn')))) return;
    handleGlobalInput(e);
  }, { passive: false });
  const rb = document.getElementById('restart-btn');
  ['pointerdown','click'].forEach(ev => rb.addEventListener(ev, e => { e.preventDefault(); AudioSys.unlock(); vibrate('light'); restartGame(); }, { passive: false }));
});
</script>
</body></html>
